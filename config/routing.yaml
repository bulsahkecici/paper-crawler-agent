  - match:
      source_class: TR_OFFICIAL
      publisher_code: KGM
      document_type: TECHNICAL_GUIDELINE
    path: "A_OFFICIAL/TR/KGM/GUIDELINES"

  - match:
      source_class: TR_OFFICIAL
      publisher_code: KGM
